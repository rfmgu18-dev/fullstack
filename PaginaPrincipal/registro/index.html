<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <title>Registro</title>
</head>
<body class="bg-zinc-50">
  <nav id="navbar" class="fixed top-0 right-0 left-0 bg-slate-900 h-17">
    </nav>

    <div id="notificacion" class="fixed top-20 right-0 left-0">

    </div>
    

  <div class="pt-17 h-screen flex max-w-7xl mx-auto justify-center items-center px-4">
    <div class="hidden lg:flex w-2/4">
      <img class="w-3/4 justify-center items-center" src="/imagenes/welcome.svg" alt="imagen de registro">
    </div>
    <form id="formulario" class="flex flex-col gap-4 bg-zinc-200 p-4 rounded-lg text-md shadow-lg lg:w-2/4">
      <div class="flex flex-col gap-2">
        <label for="nombre" class="font-bold text-zinc-900">Nombre<span class="text-red-500">*</span></label>
        <input type="text" name="nombre" id="nombre" autocomplete="off" placeholder="Ejemplo: Juan Perez"
        class="rounded-lg p-2 bg-zinc-100 focus:outline-indigo-700">
        <p class="text-xs text-zinc-800">Introduce en mayusculas tu nombre y apellido</p>
      </div>

      <div class="flex flex-col gap-2">
        <label for="email" class="font-bold text-zinc-900">Email<span class="text-red-500">*</span></label>
        <input type="email" name="correo" id="email" autocomplete="off" placeholder="Ejemplo: juan.perez@correo.com"
        class="rounded-lg p-2 bg-zinc-100 focus:outline-indigo-700">
        <p class="text-xs text-zinc-800">Introduce tu correo</p>
      </div>

      <div class="flex flex-col gap-2">
        <label for="contrasena" class="font-bold text-zinc-900">Contraseña<span class="text-red-500">*</span></label>
        <input type="password" name="contrasena" id="contrasena" autocomplete="off" class="rounded-lg p-2 bg-zinc-100 focus:outline-indigo-700">
        <p class="text-xs text-zinc-800">Minimo 8 caracteres y debe de tener numeros y letras</p>
      </div>

      <div class="flex flex-col gap-2">
        <label for="confirmarContrasena" class="font-bold text-zinc-900">Confirmar Contraseña<span class="text-red-500">*</span></label>
        <input type="password" name="confirmarContrasena" id="confirmarContrasena" autocomplete="off" class="rounded-lg p-2 bg-zinc-100 focus:outline-indigo-700">
        <p class="text-xs text-zinc-800">Las contraseñas deben coincidir</p>
      </div>

      <button id="btn-formulario" disabled class="bg-indigo-700 py-2 px-4 rounded-lg font-bold text-white hover:bg-indigo-800 transition ease-in-out duration-200 text-center disabled:opacity-50 disabled:cursor-not-allowed">Registrar</button>
    </form>
  </div>
  <script src="../componentes/nav.js"></script>
  <script type="module" src="./index.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js"></script>
  <script type="module" src="../componentes/notificacion.js"></script>
</body>
</html>
