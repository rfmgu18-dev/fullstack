<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <style>
      .true {
        outline: 2px solid green;
      }
      .false {
        outline: 2px solid red;
      }
      .show-information {
        color: red;
        font-weight: bold;
      }
    </style>
  </head>
  <body class="bg-zinc-50">
    <nav
      id="navbar"
      class="fixed top-0 left-0 right-0 bg-indigo-700 h-16"
    ></nav>    <div id="notificacion"></div>    <div
      class="flex pt-16 h-screen max-w-7xl mx-auto justify-center items-center px-4"
    >
      <div class="hidden lg:flex w-2/4 justify-center items-center px-4">
        <img class="w-3/4" src="/imagenes/welcome.svg" alt="imagen de login" />
      </div>
      <form
        id="form"
        class="flex pt-16 flex-col gap-4 bg-zinc-200 p-4 rounded-lg text-lg shadow-lg w-full md:w-9/12 lg:w-2/4"
      >
        <div class="flex flex-col gap-2">
          <label class="font-bold" for="email"
            >Email <span class="text-red-500 text-zinc-900">*</span></label
          >
          <input
            id="email"
            type="email"
            name="email"
            autocomplete="off"
            placeholder="Ingrese su correo."
            class="rounded-lg p-2 bg-zinc-100 focus:outline-indigo-700"
          />
          <p class="information text-sm text-zinc-900/60 leading-5 m-0">El correo debe seguir el formato: ejemplo@gmail.com</p>
        </div>
        <div class="flex flex-col gap-2">
          <label class="font-bold" for="password"
            >Contraseña <span class="text-red-500 text-zinc-900">*</span></label
          >
          <input
            id="password"
            type="password"
            name="password"
            autocomplete="off"
            placeholder="Ingrese tu contraseña."
            class="rounded-lg p-2 bg-zinc-100 focus:outline-indigo-700"
          />
          <p class="information text-sm text-zinc-900/60 leading-5 m-0">Debe contener al menos una mayúscula, una minúscula y un número. Mínimo 6 caracteres, máximo 24 caracteres.</p>
        </div>
        <button
          id="boton"
          disabled
          class="bg-indigo-700 py-2 px-4 rounded-lg font-bold text-white hover:bg-indigo-800 text-center transition ease-in-out disabled:opacity-40 disabled:cursor-not-allowed"
        >
          Iniciar sesión
        </button>
      </form>
    </div>
    <script src="../componentes/nav.js"></script>
    <script type="module" src="login.js"></script>
  </body>
</html>
